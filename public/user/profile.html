<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | EcoTrack</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Stylesheets -->
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/dashboard.css" rel="stylesheet">
</head>
<body>

  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <a class="eco-brand" href="/user/dashboard.html">
          <span class="eco-brand-icon"><i class="bi bi-recycle"></i></span>
          <span>EcoTrack</span>
        </a>
      </div>

      <div class="sidebar-content">
        <div class="sidebar-label">Citizen Menu</div>
        <ul class="sidebar-nav">
          <li class="sidebar-item">
            <a class="sidebar-link" href="/user/dashboard.html">
              <i class="bi bi-speedometer2"></i>
              <span>Dashboard</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a class="sidebar-link" href="/user/identify-waste.html">
              <i class="bi bi-cpu"></i>
              <span>Identify Waste (AI)</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a class="sidebar-link" href="/user/report-waste.html">
              <i class="bi bi-plus-circle"></i>
              <span>Report Waste</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a class="sidebar-link" href="/user/my-reports.html">
              <i class="bi bi-journal-text"></i>
              <span>My Reports</span>
            </a>
          </li>
        </ul>

        <div class="sidebar-label">Account</div>
        <ul class="sidebar-nav">
          <li class="sidebar-item">
            <a class="sidebar-link active" href="/user/profile.html">
              <i class="bi bi-person-gear"></i>
              <span>My Profile</span>
            </a>
          </li>
          <li class="sidebar-item">
            <a class="sidebar-link text-danger" href="#" id="btn-logout">
              <i class="bi bi-box-arrow-left"></i>
              <span>Log Out</span>
            </a>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <div class="user-mini-profile">
          <div class="avatar-circle user-display-initial">U</div>
          <div class="overflow-hidden">
            <div class="user-mini-name user-display-name text-truncate">Citizen User</div>
            <div class="user-mini-role user-display-role">Citizen</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="app-main">
      <!-- Topbar -->
      <header class="app-topbar">
        <div class="d-flex align-items-center gap-3">
          <button class="sidebar-toggle-btn" aria-label="Toggle navigation menu">
            <i class="bi bi-list"></i>
          </button>
          <h1 class="topbar-title">Citizen Profile & Settings</h1>
        </div>
      </header>

      <!-- Page Body -->
      <main class="app-body">
        <div class="row g-4">
          <!-- Profile Information Card -->
          <div class="col-lg-6">
            <div class="eco-card p-4">
              <h5 class="fw-bold mb-3">
                <i class="bi bi-person text-eco-primary me-2"></i>Personal Information
              </h5>
              <form id="form-update-profile">
                <div class="mb-3">
                  <label for="prof-fullname" class="form-label">Full Name</label>
                  <input type="text" class="form-control" id="prof-fullname" required minlength="2">
                </div>
                <div class="mb-3">
                  <label for="prof-email" class="form-label">Email Address</label>
                  <input type="email" class="form-control" id="prof-email" required>
                </div>
                <button type="submit" class="btn btn-eco-primary btn-sm px-4">
                  <i class="bi bi-save me-1"></i>Save Profile Changes
                </button>
              </form>
            </div>
          </div>

          <!-- Change Password Card -->
          <div class="col-lg-6">
            <div class="eco-card p-4">
              <h5 class="fw-bold mb-3">
                <i class="bi bi-key text-eco-primary me-2"></i>Change Password
              </h5>
              <form id="form-change-password">
                <div class="mb-3">
                  <label for="curr-password" class="form-label">Current Password</label>
                  <input type="password" class="form-control" id="curr-password" required>
                </div>
                <div class="mb-3">
                  <label for="new-password" class="form-label">New Password</label>
                  <input type="password" class="form-control" id="new-password" required minlength="6">
                  <div class="form-text text-muted small">At least 6 characters required.</div>
                </div>
                <div class="mb-3">
                  <label for="confirm-new-password" class="form-label">Confirm New Password</label>
                  <input type="password" class="form-control" id="confirm-new-password" required minlength="6">
                </div>
                <button type="submit" class="btn btn-outline-danger btn-sm px-4">
                  <i class="bi bi-shield-lock me-1"></i>Update Password
                </button>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await checkAuth();
      if (!user) return;

      // Fetch user profile details
      try {
        const res = await fetch('/api/users/profile');
        const json = await res.json();
        if (json.success && json.data) {
          document.getElementById('prof-fullname').value = json.data.full_name;
          document.getElementById('prof-email').value = json.data.email;
        }
      } catch (err) {
        showToast('Failed to load profile details.', 'error');
      }

      // Handle profile update form
      document.getElementById('form-update-profile').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullName = document.getElementById('prof-fullname').value.trim();
        const email = document.getElementById('prof-email').value.trim();

        try {
          const res = await fetch('/api/users/profile', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fullName, email })
          });
          const result = await res.json();

          if (result.success) {
            showToast('Profile updated successfully!', 'success');
            // Update displayed headers
            document.querySelectorAll('.user-display-name').forEach(el => el.textContent = fullName);
            document.querySelectorAll('.user-display-email').forEach(el => el.textContent = email);
          } else {
            showToast(result.message || 'Failed to update profile.', 'error');
          }
        } catch (err) {
          showToast('Network error updating profile.', 'error');
        }
      });

      // Handle password change form
      document.getElementById('form-change-password').addEventListener('submit', async (e) => {
        e.preventDefault();
        const currentPassword = document.getElementById('curr-password').value;
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-new-password').value;

        if (newPassword !== confirmPassword) {
          showToast('New passwords do not match.', 'warning');
          return;
        }

        try {
          const res = await fetch('/api/users/change-password', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ currentPassword, newPassword, confirmPassword })
          });
          const result = await res.json();

          if (result.success) {
            showToast('Password changed successfully!', 'success');
            document.getElementById('form-change-password').reset();
          } else {
            showToast(result.message || 'Failed to change password.', 'error');
          }
        } catch (err) {
          showToast('Network error changing password.', 'error');
        }
      });
    });
  </script>
</body>
</html>
