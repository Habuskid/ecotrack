<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | EcoTrack</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Global & Auth Stylesheets -->
  <link href="/css/style.css" rel="stylesheet">
  <link href="/css/auth.css" rel="stylesheet">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a class="eco-brand" href="/">
          <span class="eco-brand-icon"><i class="bi bi-recycle"></i></span>
          <span>EcoTrack</span>
        </a>
        <h2 class="auth-title">Join EcoTrack</h2>
        <p class="auth-subtitle">Register to report and track municipal waste</p>
      </div>

      <form id="register-form">
        <div class="mb-3">
          <label for="fullName" class="form-label">Full Name</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0">
              <i class="bi bi-person"></i>
            </span>
            <input type="text" class="form-control border-start-0" id="fullName" 
                   placeholder="e.g. Jane Doe" required minlength="2" maxlength="100">
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted border-end-0">
              <i class="bi bi-envelope"></i>
            </span>
            <input type="email" class="form-control border-start-0" id="email" 
                   placeholder="name@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="password-input-group">
            <input type="password" class="form-control" id="password" 
                   placeholder="Minimum 6 characters" required minlength="6">
            <button type="button" class="password-toggle-btn" data-target="password" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="form-text text-muted small">Must be at least 6 characters.</div>
        </div>

        <div class="mb-4">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <div class="password-input-group">
            <input type="password" class="form-control" id="confirmPassword" 
                   placeholder="Re-enter your password" required minlength="6">
            <button type="button" class="password-toggle-btn" data-target="confirmPassword" aria-label="Toggle password visibility">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-eco-primary w-100 py-2 justify-content-center">
          <i class="bi bi-person-check"></i> Register Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? 
        <a href="/login.html">Sign In Here</a>
        <div class="mt-3">
          <a href="/" class="text-muted small text-decoration-none">
            <i class="bi bi-arrow-left me-1"></i>Back to Home
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
